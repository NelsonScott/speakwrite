# speakwrite keyd snippet — merge into /etc/keyd/default.conf, then:
#     sudo keyd reload
# (If you have no keyd config yet, this file works as a minimal default.conf.)

[ids]
*

[global]
# double-tap window (ms): second Ctrl tap must land inside it
oneshot_timeout = 400

[main]
# hold = normal Ctrl; tap arms [dtap] for one keypress
leftcontrol = overload(control, oneshot(dtap))

[dtap]
# second tap -> toggle dictation
leftcontrol = command(/usr/local/bin/dictate-toggle)

# If you use ydotool for anything, make sure keyd does NOT manage its virtual
# keyboard, or speakwrite's typed output gets re-remapped. Add to [ids]:
#   -2333:6666
